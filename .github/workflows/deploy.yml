name: deploy-pages

# Один источник правды: боевой каталог не коммитится, а собирается из исходников
# tools/build-release.cjs (allowlist + вырезание отладочного хука + cache-bust).
# Поэтому источник публикации — GitHub Actions, а не ветка: Jekyll к файлам не
# применяется, и на сервер не уезжает ничего из набора проверок.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Ворота бумаг. Отделяют вопрос «можно ли это публиковать» от вопроса «собран ли
  # артефакт»: до этого коммита единственный шаг, стоящий между push и живым
  # https-хостингом, — сборка, и она не знает, что досье разошлось с game.js.
  # Поэтому build ниже стоит на needs: guards, и расхождение бумаг блокирует
  # выкладку, а не соседствует с ней зелёным деплоем.
  #
  # Здесь ТРОЕ, без check:kit. Комплект модерации держит выход 1, пока в дереве нет
  # снятого руками кадра screen-guild.png (досье §5), а машина его не производит ни
  # при каких условиях. Джоба с ним красна всегда — это ровно тот дефект
  # «декорации с открытым финалом», который уже разобран в
  # reports/2026-10-21-privacy-page.md на маркерах {{...}}. check:kit въедет сюда
  # одним коммитом с появлением кадра, не раньше.
  #
  # npm ci отсутствует намеренно: все четверо живут только на node:fs/path/crypto/
  # child_process, и jsdom с puppeteer-core на этот шаг не едут (та же экономия, что
  # в job ниже).
  guards:
    name: Бумаги перед выкладкой
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Сборка ОБЯЗАНА идти перед воротами, а не только в build ниже. check:copy
      # сверяет числа досье с _site/ и при отсутствии артефакта печатает ⏳ и
      # ПРОПУСКАЕТ эту сверку (tools/check-copy.cjs) — джоба прошла бы зелёной, не
      # померив половину того, ради чего она существует. check:kit на том же пустом
      # месте упал бы, но его здесь нет: полагаться на падение соседнего прогона
      # значит оставить следующий добавленный страж без этой защиты.
      - name: Собрать _site для сверки бумаг
        run: node tools/build-release.cjs
      - name: Тексты витрины против кода и артефакта
        run: node tools/check-copy.cjs
      - name: Живость сторожей текстов
        run: node tools/negctl-copy.cjs
      # Последний намеренно, несмотря на то что он единственный из четверых пишет в
      # общее дерево (портит assets/moderation/privacy-policy.md и восстанавливает
      # его). Порядок здесь — защита, а не косметика: если мутационный прогон умрёт
      # посреди дороги и оставит файл испорченным, следующий по цепочке check:kit
      # измерит полуиспорченное дерево и выдаст фантом вместо причины. Тот же состав,
      # гоняемый параллельно, давал 2 fail / 2 ждёт на чистом дереве
      # (reports/2026-10-22-action-plan.md).
      - name: Живость сверок политики на препаратах
        run: node tools/negctl-policy.cjs

  build:
    name: Сборка артефакта
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # У сборщика нет зависимостей (только node:fs/crypto/child_process),
      # поэтому npm ci здесь не нужен: jsdom и puppeteer-core на сервер не едут.
      - name: Собрать _site
        run: node tools/build-release.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация на Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
